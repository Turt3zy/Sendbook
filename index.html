<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e100c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sendbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sendbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: a comp scorecard. Off-white floor, white hairline cards, a lime rule under the header,
   lime primary actions, circuit-coloured problem dots. Header, scrolling content, footer bar. */
:root {
  --bg: #f3f3ef;
  --card: #ffffff;
  --line: #e1e2dc;
  --line-strong: #c9cbc2;
  --ink: #151713;
  --muted: #676b62;
  --faint: #9a9e93;
  --lime: #ccff33;
  --lime-edge: #a6d61b;
  --lime-ink: #151713;
  --ok: #0f8f46;
  --warn: #d9870a;
  --warn-bg: #fcefd6;
  --plan: #e2e5dc;
  --coast: #8f9a89;
  --border-geo: #b8beb0;
  --scrim: rgb(21 23 19 / .4);
  --shadow: 0 1px 2px rgb(21 23 19 / .06), 0 6px 18px rgb(21 23 19 / .07);
  --b0: #f7f7f4; --b1: #f6c41a; --b2: #2a9e45; --b3: #0e9c9b; --b4: #2269d8; --b5: #7c4dd9; --b6: #e9559a; --b7: #db2a2a; --b8: #1b1b1b;
  --f-display: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e100c; --card: #191c16; --line: #2a2e26; --line-strong: #3d4238; --ink: #eceee6; --muted: #a0a596;
    --faint: #6f7468; --lime: #c8f53a; --lime-edge: #9ccb1c; --lime-ink: #151713; --ok: #46cf80; --warn: #f2a93b;
    --warn-bg: #362a12; --plan: #1a1e17; --coast: #56604f; --border-geo: #3c4336; --scrim: rgb(0 0 0 / .6);
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e100c; --card: #191c16; --line: #2a2e26; --line-strong: #3d4238; --ink: #eceee6; --muted: #a0a596;
  --faint: #6f7468; --lime: #c8f53a; --lime-edge: #9ccb1c; --lime-ink: #151713; --ok: #46cf80; --warn: #f2a93b;
  --warn-bg: #362a12; --plan: #1a1e17; --coast: #56604f; --border-geo: #3c4336; --scrim: rgb(0 0 0 / .6);
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--lime-edge); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.shell { height: 100%; display: flex; flex-direction: column; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 640px; margin-inline: auto; width: 100%; }

/* Header: breadcrumbs + lime rule */
.top { background: var(--bg); flex: none; z-index: 5; }
.top .bar { display: flex; align-items: center; gap: 10px; min-height: 52px; padding-block: 8px; }
.top .rule { height: 3px; background: var(--lime); }
.icon-btn { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 22px; height: 22px; }
.divider-v { width: 1px; height: 24px; background: var(--line-strong); flex: none; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; font-size: 16px; white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--muted); text-decoration: none; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 2.5em; }
.crumbs a:hover { color: var(--ink); }
.crumbs .sep { color: var(--faint); flex: none; font-size: 13px; }
.crumbs .here { font-weight: 650; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }

.content { flex: 1; min-height: 0; overflow-y: auto; position: relative; overscroll-behavior: contain; }
.content.flush { overflow: hidden; }
.stack { display: flex; flex-direction: column; gap: 22px; padding-block: 18px 28px; }

/* Hero / headings */
.hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { color: var(--muted); font-size: 17px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(28px, 7.5vw, 36px); font-weight: 800; font-stretch: 108%; letter-spacing: -.01em; line-height: 1.08; margin-top: 2px; }
.label { font-size: 12.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-left: 2px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 6px 13px; border-radius: 999px; font-size: 14.5px; font-weight: 550; border: 1px solid var(--line); background: var(--card); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok { background: var(--lime); border-color: var(--lime-edge); color: var(--lime-ink); }
.pill.ok i { background: #0b5c26; }
.pill.warn { background: var(--warn); border-color: var(--warn); color: #1d1404; }
.pill.warn i { background: #1d1404; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.card.list { padding-block: 4px; overflow: hidden; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { padding: 13px 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.stat .k { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-size: clamp(22px, 6.5vw, 28px); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; text-decoration: none; color: inherit; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--line) 45%, transparent); }
.row + .row { border-top: 1px solid var(--line); }
.row .ic { flex: none; width: 26px; display: grid; place-items: center; color: var(--ok); }
.row .ic svg { width: 21px; height: 21px; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { flex: none; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.row .chev { flex: none; color: var(--faint); width: 16px; height: 16px; }
.warn-ic { color: var(--warn); width: 15px; height: 15px; vertical-align: -2px; margin-left: 4px; }
.mono-badge { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: .02em; background: var(--bg); border: 1.5px solid var(--line-strong); }
.mono-badge.sent { background: var(--lime); border-color: var(--lime-edge); color: var(--lime-ink); }

.banner { padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.banner.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.banner svg { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--warn); }
.banner.ok svg { color: var(--ok); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 12px; white-space: nowrap; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 650; cursor: pointer; text-decoration: none; min-height: 46px; }
.btn:hover { border-color: var(--line-strong); }
.btn svg { width: 18px; height: 18px; }
.btn.lime { background: var(--lime); border-color: var(--lime-edge); color: var(--lime-ink); }
.btn.danger { color: #c62828; }
.btn.armed { background: #c62828; border-color: #c62828; color: #fff; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.cta { flex: none; background: var(--bg); }
.cta .rule { height: 3px; background: var(--lime); }
.cta .in { padding-block: 12px 10px; }
.cta .btn { width: 100%; font-size: 17px; min-height: 56px; border-radius: 16px; }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14.5px; font-weight: 550; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--lime); border-color: var(--lime-edge); color: var(--lime-ink); }
.chip svg { width: 16px; height: 16px; }

/* Floating pills over the map */
.floatbar { position: absolute; z-index: 500; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; pointer-events: none; }
.floatbar > * { pointer-events: auto; }
.floatbar .grow { flex: 1; min-width: 0; }
.fpill { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; font-size: 15.5px; cursor: pointer; white-space: nowrap; max-width: 100%; }
.fpill.on { background: var(--lime); border-color: var(--lime-edge); color: var(--lime-ink); }
.fpill svg { width: 18px; height: 18px; flex: none; }
.fpill.select { position: relative; padding-right: 36px; overflow: hidden; }
.fpill.select span { overflow: hidden; text-overflow: ellipsis; }
.fpill.select::after { content: ""; position: absolute; right: 15px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.fpill.select select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; font-size: 16px; }
.map-bottom { position: absolute; z-index: 500; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; gap: 8px; }
.fab { position: absolute; z-index: 600; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; width: 58px; height: 58px; border-radius: 50%; background: var(--lime); border: 1px solid var(--lime-edge); color: var(--lime-ink); display: grid; place-items: center; box-shadow: var(--shadow); cursor: pointer; }
.fab svg { width: 26px; height: 26px; }

/* Map */
.map { position: absolute; inset: 0; background: var(--plan); }
.listscroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
.floatbar.on-list::before { content: ""; position: absolute; inset: -10px -16px -16px; background: linear-gradient(var(--bg) 62%, transparent); z-index: -1; }
.map.plan .leaflet-container, .map.plan { background: var(--plan); }
.imgov { image-rendering: auto; }
.leaflet-control-attribution { max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leaflet-control-attribution:hover, .leaflet-control-attribution:focus-within { white-space: normal; }
.leaflet-container { font-family: var(--f-body); }
.leaflet-control-attribution { font-size: 10px; }
.leaflet-control-scale-line { background: color-mix(in srgb, var(--card) 80%, transparent); color: var(--ink); border-color: var(--muted); }
.map-empty { position: absolute; z-index: 450; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(320px, calc(100% - 120px)); padding: 14px; text-align: center; box-shadow: var(--shadow); }
.crosshair { position: absolute; z-index: 500; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); pointer-events: none; color: var(--ink); }
.map-hint { position: absolute; z-index: 500; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 7px 12px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 13px; white-space: nowrap; }
.sector-tag { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: rgb(0 0 0 / .5); padding: 3px 7px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, 14px); display: inline-block; pointer-events: none; }
.plan .sector-tag { background: var(--muted); color: var(--card); }

/* Problem dots */
.dot { --d: 30px; position: relative; width: var(--d); height: var(--d); border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: calc(var(--d) * .4); line-height: 1; border: max(1.5px, calc(var(--d) * .07)) solid #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); color: #fff; font-variant-numeric: tabular-nums; flex: none; }
.dot.approx { border-style: dashed; }
.dot.b0 { background: var(--b0); color: #151713; border-color: #9c9f96; }
.dot.b1 { background: var(--b1); color: #151713; }
.dot.b2 { background: var(--b2); } .dot.b3 { background: var(--b3); } .dot.b4 { background: var(--b4); }
.dot.b5 { background: var(--b5); } .dot.b6 { background: var(--b6); } .dot.b7 { background: var(--b7); }
.dot.b8 { background: var(--b8); }
.dot .bd { position: absolute; top: -18%; right: -18%; width: 46%; height: 46%; border-radius: 50%; display: grid; place-items: center; }
.dot .bd svg { width: 70%; height: 70%; }
.dot .bd.sent { background: var(--lime); color: #151713; box-shadow: 0 0 0 1px rgb(0 0 0 / .35); }
.dot .bd.proj { background: var(--card); box-shadow: inset 0 0 0 2.5px var(--warn); }
.dot .bd.tried { width: 30%; height: 30%; top: -8%; right: -8%; background: #8a8d85; box-shadow: 0 0 0 1px #fff; }
.leaflet-div-icon.dot-icon { background: none; border: 0; }
.leaflet-div-icon.dot-icon .dot { cursor: pointer; }
.area-pin { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--ink); font-weight: 800; font-size: 12px; color: var(--ink); box-shadow: 0 1px 4px rgb(0 0 0 / .3); cursor: pointer; }
.area-pin.sent { background: var(--lime); border-color: #151713; color: #151713; }
.area-pin.warn { border-color: var(--warn); }
.area-label { font-size: 11px; font-weight: 650; color: var(--ink); text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); white-space: nowrap; }

/* Route rows */
.rrow { display: flex; align-items: center; gap: 14px; padding: 11px 12px 11px 16px; }
.rrow + .rrow { border-top: 1px solid var(--line); }
.rrow .main { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 3px; background: none; border: 0; padding: 0; text-align: left; }
.rrow .t { font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .s { color: var(--muted); font-size: 14px; display: flex; gap: 8px; white-space: nowrap; overflow: hidden; }
.rrow .s b { color: var(--ink); font-weight: 650; }
.tick { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--faint); }
.tick svg { width: 30px; height: 30px; }
.tick.done { color: var(--lime-ink); }
.tick.done .disc { fill: var(--lime); stroke: var(--lime-edge); }

/* Tab bar */
.tabbar { flex: none; background: var(--bg); border-top: 1px solid var(--line); }
.tabbar .in { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-block: 8px 6px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0; }
.tab .ib { width: 62px; height: 32px; border-radius: 999px; display: grid; place-items: center; }
.tab svg { width: 21px; height: 21px; }
.tab.on { color: var(--ink); }
.tab.on .ib { background: var(--lime); color: var(--lime-ink); }

/* Sheets */
#sheets .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 1000; }
.sheet { position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .2); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.sheet.tall { height: 92%; display: flex; flex-direction: column; overflow: hidden; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 8px auto 2px; }
.sheet .sh { display: flex; align-items: center; gap: 10px; padding-block: 6px 4px; }
.sheet .sh h2 { flex: 1; font-size: 17px; font-weight: 650; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet .sh .link { background: none; border: 0; font-weight: 600; cursor: pointer; padding: 8px 4px; min-width: 64px; }
.sheet .sh .link.strong { font-weight: 750; }
.sheet .sh .link[disabled] { opacity: .35; }
.sheet .body { display: flex; flex-direction: column; gap: 20px; padding-block: 10px 6px; }
.sheet.tall .mapbox { position: relative; flex: 1; min-height: 0; margin-top: 8px; }
@media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 600px; transform: translateX(-50%); border-radius: 22px 22px 0 0; } }

.rhead { display: flex; gap: 14px; align-items: center; }
.rhead h2 { font-size: 22px; font-weight: 750; font-stretch: 104%; line-height: 1.15; }
.rhead .meta { color: var(--muted); font-size: 14.5px; margin-top: 3px; }
.rhead .pills { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.stars { color: var(--warn); letter-spacing: 1px; }

.hist .h { display: flex; gap: 12px; align-items: center; padding: 11px 12px 11px 16px; }
.hist .h + .h { border-top: 1px solid var(--line); }
.hist .h .what { flex: 1; min-width: 0; }
.hist .h .what b { font-weight: 650; }
.hist .h .when { color: var(--muted); font-size: 14px; text-align: right; white-space: nowrap; }
.hist .h .sic { width: 22px; flex: none; color: var(--ok); display: grid; place-items: center; }
.hist .h .sic svg { width: 18px; height: 18px; }
.xbtn { flex: none; border: 0; background: none; color: var(--faint); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; font-size: 12px; font-weight: 700; }
.xbtn svg { width: 16px; height: 16px; }
.xbtn.armed { background: #c62828; color: #fff; width: auto; padding: 0 10px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 550; }
.input, .select, textarea.input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus, .select:focus { border-color: var(--lime-edge); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--lime) 45%, transparent); }
.input.mono { font-family: var(--f-mono); font-size: 15px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 9px 6px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.seg button.on { background: var(--lime); color: var(--lime-ink); }

function parseGrade(raw, disc) {
  let s = String(raw || '').toUpperCase().replace(/\s+/g, '');
  if (!s) return null;
  for (const p of ['EWBANK:', 'EWBANK', 'AU', 'BLDV:', 'GRADE:']) {
    if (s.startsWith(p) && s.length > p.length && /[0-9V]/.test(s[p.length])) s = s.slice(p.length);
  }
  if (s.startsWith('VB')) return { sys: 'v', val: -1 };
  let m;
  if ((m = s.match(/^V(\d+)(\/)?/))) return { sys: 'v', val: +m[1] + (m[2] ? 0.5 : 0) };
  if (s.startsWith('5.')) {
    const k = s.replace(/[+-]/g, '').split('/')[0];
    return YDS[k] != null ? { sys: 'e', val: YDS[k] } : null;
  }
  if ((m = s.match(/^(\d+)([ABC])(\+)?/))) {
    const key = m[1] + m[2] + (m[3] || '');
    if (disc === 'boulder' && FONT[key] != null) return { sys: 'v', val: FONT[key] };
    if (FR[key] != null) return { sys: 'e', val: FR[key] };
    if (FONT[key] != null) return { sys: 'v', val: FONT[key] };
    return null;
  }
  if ((m = s.match(/^(\d+)(\/)?/))) {
    const n = +m[1];
    if (disc === 'boulder' && n <= 5) return { sys: 'v', val: Math.max(-1, n - 4) };
    const e = n + (m[2] ? 0.5 : 0);
    return e >= 1 && e <= 40 ? { sys: 'e', val: e } : null;
  }
  return null;
}
function gradeBand(g) {
  if (!g) return 0;
  const w = Math.floor(g.val);
  if (g.sys === 'v') return w <= 0 ? 0 : w <= 6 ? w : w <= 8 ? 7 : 8;
  if (w <= 14) return 0;
  if (w <= 17) return 1;
  return Math.min(8, 2 + Math.floor((w - 18) / 2));
}
function gradeLabel(g) {
  if (!g) return '?';
  const w = Math.floor(g.val), half = g.val - w >= 0.5;
  if (g.sys === 'v') return g.val < 0 ? 'VB' : half ? `V${w}/${w + 1}` : `V${w}`;
  return half ? `${w}/${w + 1}` : `${w}`;
}
function gradeCmp(a, b) {
  if (!a && !b) return 0; if (!a) return 1; if (!b) return -1;
  if (a.sys !== b.sys) return a.sys === 'v' ? -1 : 1;
  return a.val - b.val;
}
function gradePoints(g, style) {
  if (!g || !STYLE[style] || !STYLE[style].clean) return 0;
  const base = g.sys === 'v' ? (Math.max(g.val, -1) + 2) * 100 : Math.max(g.val - 10, 1) * 50;
  const bonus = style === 'onsight' ? 150 : style === 'flash' ? 100 : 0;
  return Math.round(base + bonus);
}
function gradePicks(disc) {
  if (disc === 'boulder') return ['VB', 'V0', ...Array.from({ length: 14 }, (_, i) => `V${i + 1}`)];
  return Array.from({ length: 24 }, (_, i) => String(i + 10));
}

function discFromText(t) {
  const s = String(t || '').toLowerCase();
  if (!s) return null;
  if (s.includes('boulder')) return 'boulder';
  if (s.includes('sport')) return 'sport';
  if (s.includes('trad') || s.includes('alpine') || s.includes('aid')) return 'trad';
  if (s.includes('top rope') || s.includes('toprope')) return 'toprope';
  if (s.includes('deep water') || s.includes('dws')) return 'dws';

}
// theCrag tick labels ("Red point", "Hang dog", "Target"…) → style; null = to-do marker.
function styleFromTick(raw, disc) {
  const t = String(raw || '').toLowerCase().replace(/[^a-z]/g, '');
  if (['target', 'mark', 'marked', 'project', 'todo', 'wanttodo'].includes(t)) return null;
  let s;
  if (t.includes('toprope') || t.startsWith('second') || t === 'follow') s = 'toprope';
  else if (t.includes('onsight')) s = 'onsight';
  else if (t.includes('flash')) s = 'flash';
  else if (t.includes('redpoint') || t.includes('pinkpoint') || t === 'clean') s = 'redpoint';
  else if (t.includes('repeat')) s = 'repeat';
  else if (t.includes('dog') || t.includes('attempt') || t.includes('working') || t.includes('retreat') || t === 'aid' || t === 'fall') s = 'attempt';
  else s = 'send';
  if (isV(disc) && s === 'redpoint') return 'send';
  if (isV(disc) && s === 'onsight') return 'flash';
  return s;
}

// ============================================================================
// Store: your account (when hosted on Claude) or this device
// ============================================================================
const KINDS = ['areas', 'sectors', 'routes'];
let data = { areas: {}, sectors: {}, routes: {} };
const LOCAL_KEY = 'sendbook.data.v1';

const store = {
  mode: 'device',          // 'device' | 'connecting' | 'account'
  loaded: true,
  note: '',
  cloud: null,
  queue: {},
  loadLocal() {
    const d = ls.get(LOCAL_KEY, null);
    if (d) for (const k of KINDS) data[k] = d[k] || {};
  },
  saveLocalNow() {
    const ok = ls.set(LOCAL_KEY, data);
    if (!ok) toast('Couldn’t save on this device. Storage is full or blocked; export a backup from Sources.');
  },
  saveLocal: null,
  // Changes not yet confirmed by the account store, layered over every snapshot so a refresh that
  // arrives mid-import doesn't briefly drop routes that are still waiting their turn to save.
  local: {}, localCount: {},
  put(kind, obj) {
    data[kind][obj.id] = obj;
    if (this.mode === 'account' && this.cloud) {
      const body = clone(obj);
      this.hold(kind, obj.id, body);
      this.enqueue(kind, obj.id, () => this.cloud[kind].doc(obj.id).set(body));
    } else this.saveLocal();
  },
  del(kind, id) {
    delete data[kind][id];
    if (this.mode === 'account' && this.cloud) {
      this.hold(kind, id, null);
      this.enqueue(kind, id, () => this.cloud[kind].doc(id).delete());
    } else this.saveLocal();
  },
  hold(kind, id, value) {
    const key = kind + '/' + id;
    this.local[key] = value;
    this.localCount[key] = (this.localCount[key] || 0) + 1;
  },
  settle(key) {
    if (--this.localCount[key] <= 0) { delete this.localCount[key]; delete this.local[key]; }
  },
  overlay(kind, next) {
    const prefix = kind + '/';
    for (const key in this.local) {
      if (!key.startsWith(prefix)) continue;
      const id = key.slice(prefix.length), v = this.local[key];
      if (v === null) delete next[id]; else next[id] = clone(v);
    }
    return next;
  },
  // Account writes: one at a time per document, at most 4 in flight overall, with backoff when the
  // store is busy, so a big import (150 routes) doesn't trip its rate limits.
  inflight: 0, waiters: [], pending: 0, lastErr: 0,
  async slot() {
    if (this.inflight >= 4) await new Promise(r => this.waiters.push(r));
    this.inflight++;
  },
  release() { this.inflight--; const w = this.waiters.shift(); if (w) w(); },
  enqueue(kind, id, fn) {
    const key = kind + '/' + id;
    const attempt = async () => {
      for (let i = 0; ; i++) {
        await this.slot();
        let err = null;
        try { return await fn(); } catch (e) { err = e || {}; } finally { this.release(); }
        if ((err.code === 'unavailable' || err.code === 'resource_exhausted') && i < 5) {
          await new Promise(r => setTimeout(r, (500 << i) + Math.random() * 400));
          continue;
        }
        throw err;
      }
    };
    this.pending++;
    const next = (this.queue[key] || Promise.resolve()).then(attempt).catch(e => {
      const code = e && e.code;
      if (Date.now() - this.lastErr < 4000) return;
      this.lastErr = Date.now();
      toast(code === 'quota_exceeded'
        ? 'Your saved log is full. Export a backup and delete old entries.'
        : `Couldn’t save a change (${code || 'error'}). It’s shown here but may not be stored.`);
    }).finally(() => { this.pending--; this.settle(key); });
    this.queue[key] = next;
  },
  async connect() {
    if (!env.hosted) return;
    this.mode = 'connecting';
    this.loaded = false;
    scheduleRender();
    try {
      const [dbNs, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!dbNs || !uid) {
        this.mode = 'device'; this.loaded = true;
        this.note = 'Sign in to Claude to keep your log in your account. For now it’s saved in this browser only.';
        scheduleRender();
        return;
      }
      const root = dbNs.doc(`data/users/${uid}/log`);
      const cols = {}, seen = {};
      for (const k of KINDS) cols[k] = root.collection(k);
      this.cloud = cols;
      data = { areas: {}, sectors: {}, routes: {} };
      this.mode = 'account';
      for (const k of KINDS) {
        cols[k].onSnapshot(snap => {
          const next = {};
          for (const d of snap.docs) { const v = d.data(); if (v) next[d.id] = clone(v); }
          data[k] = this.overlay(k, next);
          seen[k] = true;
          if (KINDS.every(x => seen[x])) this.loaded = true;
          scheduleRender();
        }, err => {
          this.note = `Lost the connection to your saved log (${err && err.code}). Reload to reconnect.`;
          scheduleRender();
        });
      }
    } catch (e) {
      this.mode = 'device'; this.loaded = true;
      scheduleRender();
    }
  },
};
store.saveLocal = debounce(() => store.saveLocalNow(), 250);

// ---------- Areas: seed + your overrides + your own areas
function seedArea(s) {
  return { id: s.id, name: s.name, aliases: s.aliases || [], region: s.region, sub: s.sub || null, lat: s.lat, lon: s.lon,
    disc: s.disc, style: s.style, count: s.count, path: s.path, node: s.node, warn: s.warn, note: s.note, custom: false };
}
let areaCache = null, areaCacheKey = null;
function allAreas() {
  const key = JSON.stringify(data.areas);
  if (areaCache && key === areaCacheKey) return areaCache;
  const out = [];

  for (const s of SEED) {
    const a = seedArea(s);
    const o = data.areas[s.id];
    if (o) {
      if (o.lat != null && o.lon != null) { a.lat = o.lat; a.lon = o.lon; }
      if (o.disc && o.disc.length) a.disc = o.disc;
      if (o.name) a.name = o.name;
    }
    out.push(a); seen.add(a.id);
  }
  for (const o of Object.values(data.areas)) {
    if (!o.custom || seen.has(o.id)) continue;
    out.push({ id: o.id, name: o.name || 'Unnamed area', aliases: [], region: o.region || 'Unsorted imports', sub: null,
      lat: o.lat ?? null, lon: o.lon ?? null, disc: o.disc && o.disc.length ? o.disc : ['boulder'], style: '', count: 0,

function routeRowHTML(r) {

}
function filterActive() { const f = ui.filter; return f.status !== 'all' || f.disc.length || f.bands.length; }
function applyFilter(rs, secId) {
  const f = ui.filter;
  const out = rs.filter(r => {
    if (secId && r.sector !== secId) return false;
    if (f.disc.length && !f.disc.includes(r.disc)) return false;
    if (f.bands.length && !f.bands.includes(routeBand(r))) return false;
    const st = routeStatus(r);
    if (f.status === 'todo') return st.kind !== 'sent';
    if (f.status === 'sent') return st.kind === 'sent';
    if (f.status === 'projects') return st.kind === 'proj' || st.kind === 'tried';
    return true;
  });
  if (f.sort === 'name') out.sort((a, b) => a.name.localeCompare(b.name));
  else if (f.sort === 'grade') out.sort((a, b) => gradeCmp(routeGrade(a), routeGrade(b)) || (a.num - b.num));
  else out.sort((a, b) => (a.num || 0) - (b.num || 0));

}

// ---------- Board
function boardHTML(routes, heading, area) {
  const start = ui.window === 'd90' ? Date.now() - 90 * 864e5 : ui.window === 'year' ? Date.now() - 365 * 864e5 : 0;
  const inWin = allAscents(routes).filter(a => new Date(a.date).getTime() >= start);
  const ticks = inWin.filter(a => STYLE[a.style]?.clean);
  const days = new Set(inWin.map(a => new Date(a.date).toDateString())).size;
  const best = {};
  for (const a of ticks) {
    const p = gradePoints(routeGrade(a.route), a.style);
    if (!best[a.route.id] || best[a.route.id].p < p) best[a.route.id] = { a, p };
  }
  const bests = Object.values(best);
  const isB = x => isV(x.a.route.disc);
  const score = b => bests.filter(x => isB(x) === b).map(x => x.p).sort((x, y) => y - x).slice(0, 10).reduce((s, x) => s + x, 0);
  const hardest = b => { const gs = bests.filter(x => isB(x) === b).map(x => routeGrade(x.a.route)).filter(Boolean).sort(gradeCmp); return gs.length ? gradeLabel(gs[gs.length - 1]) : '–'; };
  const pyr = {};
  for (const x of bests.filter(x => isB(x) === (ui.pyramid === 'boulder'))) {
    const g = routeGrade(x.a.route); if (!g) continue;
    const k = g.sys + Math.floor(g.val);
    pyr[k] = pyr[k] || { g: { sys: g.sys, val: Math.floor(g.val) }, n: 0, f: 0 };
    pyr[k].n++; if (STYLE[x.a.style].first) pyr[k].f++;
  }
  const rows = Object.values(pyr).sort((a, b) => gradeCmp(b.g, a.g));
  const max = Math.max(1, ...rows.map(r => r.n));
  const top = bests.sort((x, y) => y.p - x.p).slice(0, 10);
  const winSel = `<select class="select" style="width:auto;padding:8px 12px" data-change="window" aria-label="Time window">${[['d90', '90 days'], ['year', '12 months'], ['all', 'All time']].map(([v, t]) => `<option value="${v}"${ui.window === v ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
  return `<div class="pad"><div class="inner stack">
    <div class="hero"><div><p class="eyebrow">Board</p><h1>${esc(heading)}</h1></div>${winSel}</div>
    <div class="stats">${stat('Sends', ticks.length)}${stat('Flash / OS', ticks.filter(a => STYLE[a.style].first).length)}${stat('Days out', days)}</div>
    <div class="stats two">${stat('Hardest boulder', hardest(true))}${stat('Hardest route', hardest(false))}</div>
    <section class="group"><h2 class="label">Scores · top 10</h2>
      <div class="card list">${row({ icon: ICON.trophy, title: 'Boulder score', right: String(score(true)), chev: false })}${row({ icon: ICON.trophy, title: 'Route score', right: String(score(false)), chev: false })}</div>
      <p class="note">Best ascent per problem or route, top 10 summed. Boulders: V0 = 200, +100 per grade. Routes: (Ewbank − 10) × 50. Flash +100, onsight +150.</p>
    </section>
    <section class="group"><div class="group-head"><h2 class="label">Pyramid</h2>
      <div class="seg" style="width:200px">${[['boulder', 'Boulder'], ['route', 'Routes']].map(([v, t]) => `<button type="button" class="${ui.pyramid === v ? 'on' : ''}" data-act="pyramid" data-v="${v}">${t}</button>`).join('')}</div></div>
      <div class="card">${rows.length ? `<div class="pyr">${rows.map(r => `<div class="pr"><span class="gl">${gradeLabel(r.g)}</span><span class="track"><span class="bar b${gradeBand(r.g)}" style="width:${(r.n / max) * 100}%;background:var(--b${gradeBand(r.g)})"></span>${r.f ? `<span class="fg" style="width:${(r.f / max) * 100}%"></span>` : ''}</span><span class="n">${r.n}</span></div>`).join('')}<div class="legend"><i></i>Flash / onsight</div></div>` : '<div class="empty">No sends in this window yet.</div>'}</div>
    </section>
    <section class="group"><h2 class="label">Top sends</h2>
      <div class="card list">${top.length ? top.map((x, i) => `<div class="trow"><span class="rank">${i + 1}</span>${dotHTML(x.a.route, 30, { number: false })}<span class="main"><span class="t">${esc(x.a.route.name)}</span><span class="s">${esc([x.a.route.grade, STYLE[x.a.style].label, area ? fmtDate(x.a.date) : (areaById(x.a.route.area)?.name || '')].filter(Boolean).join(' · '))}</span></span><span class="pts">${x.p}</span></div>`).join('') : '<div class="empty">Tick something and it’ll show up here.</div>'}</div>
    </section>
  </div></div>`;
}

// ---------- Feed

    const r = a.route, ar = areaById(r.area), sec = data.sectors[r.sector];

}

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mapMemo = ls.get('sendbook.mapviews', {});
const saveMapMemo = debounce(() => ls.set('sendbook.mapviews', mapMemo), 400);
const LAYERS = {
  aerial: { label: 'Aerial', make: () => L.tileLayer('https://spatial-img.information.qld.gov.au/arcgis/rest/services/Basemaps/LatestStateProgram_AllUsers/ImageServer/tile/{z}/{y}/{x}',
    // Retina screens get tiles one level sharper (detectRetina halves the tile size and adds a level).
    { detectRetina: true, maxNativeZoom: L.Browser.retina ? 19 : 20, maxZoom: 22, attribution: QLD_CREDIT }) },
  sat: { label: 'Satellite', make: () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxNativeZoom: 19, maxZoom: 21, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' }) },
  street: { label: 'Street', make: () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxNativeZoom: 19, maxZoom: 21, attribution: '© OpenStreetMap contributors' }) },
};
const LAYER_ORDER = ['aerial', 'sat', 'street'];
function baseMap(el, key) {
  if (!window.L || !el) {
    if (el) el.innerHTML = '<div class="card map-empty"><b>Map unavailable</b><p class="note" style="margin-top:6px">The map library didn’t load. Check your connection; the list view still works.</p></div>';
    return null;
  }
  const bundled = !env.tiles && IMAGERY.length > 0;
  const m = L.map(el, { zoomControl: false, attributionControl: env.tiles || bundled, zoomSnap: 0.5, maxZoom: 21, worldCopyJump: false });
  if (m.attributionControl) m.attributionControl.setPrefix(false);
  if (env.tiles) {
    if (!LAYERS[ui.baseLayer]) ui.baseLayer = 'aerial';
    let current = LAYERS[ui.baseLayer].make().addTo(m);
    const Toggle = L.Control.extend({ options: { position: 'bottomright' }, onAdd() {
      const b = L.DomUtil.create('button', 'fpill');
      const next = () => LAYER_ORDER[(LAYER_ORDER.indexOf(ui.baseLayer) + 1) % LAYER_ORDER.length];
      b.type = 'button'; b.style.margin = '0 0 84px 0'; b.style.padding = '8px 12px'; b.style.fontSize = '13px';
      b.textContent = LAYERS[next()].label;
      b.setAttribute('aria-label', 'Switch map to ' + LAYERS[next()].label);
      L.DomEvent.disableClickPropagation(b);
      b.onclick = () => {
        ui.baseLayer = next(); saveUI();
        m.removeLayer(current); current = LAYERS[ui.baseLayer].make().addTo(m);
        b.textContent = LAYERS[next()].label;
        b.setAttribute('aria-label', 'Switch map to ' + LAYERS[next()].label);

      return b;
    } });
    new Toggle().addTo(m);
  } else {

    for (const line of GEO.border) L.polyline(line, { color: cssVar('--border-geo'), weight: 1.2, dashArray: '5 5', interactive: false }).addTo(m);
  }
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(m);
  // Remember the view only after you've moved the map yourself, so the automatic first view (e.g. an
  // empty crag) doesn't stick once routes are pinned.
  let touched = false;
  const mark = () => { touched = true; };
  m.on('dragstart', mark);
  el.addEventListener('wheel', mark, { passive: true });
  el.addEventListener('touchstart', e => { if (e.touches.length > 1) mark(); }, { passive: true });
  el.addEventListener('dblclick', mark);
  m.on('moveend', () => { if (key && touched) { const c = m.getCenter(); mapMemo[key] = [c.lat, c.lng, m.getZoom()]; saveMapMemo(); } });
  maps.push(m);
  return m;
}
// Loads only the photos that are on screen at a useful zoom, and unloads the rest.
// Level 9: one image for all of SEQ. Level 11: regional pieces. 17: ~1.6 km around a crag. 19: ~550 m, about 30 cm a pixel.
function addBundledImagery(m) {
  const show = { 9: z => z < 10, 11: z => z >= 10, 17: z => z >= 12.5, 19: z => z >= 15 };
  const panes = { 9: 201, 11: 202, 17: 203, 19: 204 };
  for (const [lv, zi] of Object.entries(panes)) m.createPane('img' + lv).style.zIndex = zi;
  const live = new Map();
  const items = IMAGERY.map(([file, lv, s, w, n, e]) => ({ file, lv, bounds: L.latLngBounds([s, w], [n, e]) }));
  const update = () => {
    const z = m.getZoom(), view = m.getBounds().pad(0.15);
    for (const it of items) {
      const want = show[it.lv](z) && view.intersects(it.bounds);
      const have = live.get(it.file);
      if (want && !have) live.set(it.file, L.imageOverlay(`map/${it.file}.webp`, it.bounds, { pane: 'img' + it.lv, interactive: false, className: 'imgov' }).addTo(m));
      else if (!want && have) { m.removeLayer(have); live.delete(it.file); }
    }
  };
  m.on('moveend', update);
  m.whenReady(update);
  m.attributionControl.addAttribution(`<a href="https://www.data.qld.gov.au/dataset/queensland-imagery-latest-state-program-public-basemap-service" target="_blank" rel="noopener">Imagery © State of Queensland, CC BY-SA</a>; © Planet Labs`);
}
function restoreView(m, key, fallback) {
  const v = key && mapMemo[key];
  if (v) m.setView([v[0], v[1]], v[2], { animate: false });
  else fallback();
}
function mountAreasMap(el, areas) {
  const m = baseMap(el, 'areas:' + (location.hash || '#crags'));
  if (!m) return;
  const pts = [];
  for (const a of areas) {
    if (a.lat == null) continue;
    const cls = `area-pin${areaSent(a) ? ' sent' : ''}${a.warn ? ' warn' : ''}`;
    const icon = L.divIcon({ className: 'leaflet-div-icon dot-icon', iconSize: [34, 34], iconAnchor: [17, 17],
      html: `<div class="${cls}" title="${esc(a.name)}">${esc(DISC[a.disc[0]]?.short || '•')}</div>` });
    const mk = L.marker([a.lat, a.lon], { icon, title: a.name, keyboard: true }).addTo(m);
    mk.bindTooltip(esc(a.name), { direction: 'top', offset: [0, -16], permanent: areas.length <= 14, className: 'area-label-tip' });
    mk.on('click', () => go('a-' + a.id));
    pts.push([a.lat, a.lon]);
  }
  restoreView(m, 'areas:' + (location.hash || '#crags'), () => {
    if (pts.length > 1) m.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
    else if (pts.length) m.setView(pts[0], 12);
    else m.setView([-27.4, 152.9], 8);
  });
}
function pinsFor(routes) {
  const out = [];
  const fan = {};
  for (const r of [...routes].sort((a, b) => (a.num || 0) - (b.num || 0))) {
    const p = routePoint(r);
    if (p) { out.push({ r, p, approx: false }); continue; }
    const s = data.sectors[r.sector];
    const sp = sectorPoint(s);
    if (!sp) continue;
    const fk = sp.lat.toFixed(6) + ',' + sp.lon.toFixed(6);
    const i = fan[fk] = (fan[fk] ?? -1) + 1;
    const ang = i * 137.508 * Math.PI / 180, rad = 7 * Math.sqrt(i + 1);
    out.push({ r, p: offset(sp, rad * Math.cos(ang), rad * Math.sin(ang)), approx: true });
  }
  return out;
}
function mountAreaMap(el, a, routes, sectors) {
  const key = 'area:' + a.id;
  const m = baseMap(el, key);
  if (!m) return;
  const pts = [];
  if (a.lat != null) {
    L.circleMarker([a.lat, a.lon], { radius: 6, color: cssVar('--ink'), weight: 2, fillColor: cssVar('--lime'), fillOpacity: 1, interactive: false }).addTo(m);
    pts.push([a.lat, a.lon]);
  }
  for (const s of sectors) {
    const sp = sectorPoint(s);
    if (!sp) continue;
    L.marker([sp.lat, sp.lon], { interactive: false, icon: L.divIcon({ className: 'leaflet-div-icon dot-icon', iconSize: [0, 0], html: `<span class="sector-tag">${esc(s.name)}</span>` }) }).addTo(m);
  }
  const pins = pinsFor(routes);
  for (const { r, p, approx } of pins) {
    const icon = L.divIcon({ className: 'leaflet-div-icon dot-icon', iconSize: [30, 30], iconAnchor: [15, 15], html: dotHTML(r, 30, { approx }) });
    const mk = L.marker([p.lat, p.lon], { icon, title: `${r.num}. ${r.name} ${r.grade}`, keyboard: true, riseOnHover: true }).addTo(m);
    mk.on('click', () => openRouteSheet(r.id));
    pts.push([p.lat, p.lon]);
  }
  if (env.gps && geo.pos) L.circleMarker([geo.pos.lat, geo.pos.lon], { radius: 7, color: '#fff', weight: 3, fillColor: '#2a7bf6', fillOpacity: 1, interactive: false }).addTo(m);
  restoreView(m, key, () => {
    if (pts.length > 1) m.fitBounds(pts, { padding: [70, 50], maxZoom: 19 });
    else if (pts.length) m.setView(pts[0], 17);
    else m.setView([-27.4, 152.9], 9);
  });
}

async function syncTheCrag(full) {
  const key = ls.get('sendbook.cragKey', '').trim();
  if (!key) { setMsg('api', 'Paste your personal API key first.'); return; }
  setMsg('api', 'Syncing…');
  const since = full ? 0 : ls.get('sendbook.cragSince', 0);
  const all = [];
  try {
    for (let page = 1; page <= 80; page++) {
      const u = new URL('https://www.thecrag.com/api/logbook/ascents');
      u.searchParams.set('page', page);
      if (since) u.searchParams.set('since', since);
      const res = await fetch(u, { headers: { 'X-CData-Key': `key=${key}`, 'Accept': 'application/json' } });
      if (res.status === 401 || res.status === 403) throw new Error('theCrag rejected the key. Check it’s active and your supporter status is current.');
      if (res.status === 429) throw new Error('Weekly API budget used up. It resets once a week.');
      if (!res.ok) throw new Error(`theCrag returned HTTP ${res.status}.`);
      const j = await res.json();
      const d = j.data || j;
      const list = d.ascents || [];
      all.push(...list);
      const per = +d.perPage || 250, total = +d.numberAscents || all.length;
      if (!list.length || list.length < per || all.length >= total) break;
      await new Promise(r => setTimeout(r, 1200));
    }
  } catch (e) {
    setMsg('api', e instanceof TypeError
      ? 'Your browser blocked the call to theCrag (it doesn’t allow other websites to read its API). Use the CSV import instead.'
      : e.message);
    return;
  }
  const merger = makeMerger(ui.createUnmatched);
  let maxEpoch = since;
  for (const a of all) { const it = itemFromAPI(a); merger.ingest(it); maxEpoch = Math.max(maxEpoch, it.epoch || 0); }
  ls.set('sendbook.cragSince', maxEpoch);
  setMsg('api', all.length ? merger.text() : 'Up to date. No new ascents.');

async function offerFile(filename, text, mime) {
  if (env.hosted) {
    try {
      const dl = await window.claude.use('downloads');
      if (!dl) { toast('Saving files isn’t available here.'); return; }
      await dl.save({ filename, data: text });
      toast('Saved');
    } catch (e) {
      if (e && e.code === 'declined') return;
      toast(`Couldn’t save the file (${e && e.code || 'error'}).`);
    }
    return;
  }
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function exportCSV() {
  const lines = ['Date,Region,Area,Sector,Route,Grade,Discipline,Style,Attempts,Latitude,Longitude,Notes'];
  for (const a of allAscents(Object.values(data.routes)).sort((x, y) => x.date.localeCompare(y.date))) {
    const r = a.route, ar = areaById(r.area), s = data.sectors[r.sector];
    const p = routePoint(r) || sectorPoint(s) || (ar && ar.lat != null ? ar : null);
    lines.push([a.date.slice(0, 10), ar?.region, ar?.name, s?.name, r.name, r.grade, DISC[r.disc]?.label, STYLE[a.style]?.label, a.attempts || 1, p ? p.lat.toFixed(6) : '', p ? p.lon.toFixed(6) : '', a.notes].map(csvCell).join(','));
  }
  offerFile(`sendbook-ascents-${new Date().toISOString().slice(0, 10)}.csv`, lines.join('\n'), 'text/csv');
}
function exportJSON() {
  offerFile(`sendbook-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'sendbook', version: 1, exported: nowISO(), ...data }, null, 1), 'application/json');
}
function restoreBackup(obj) {
  if (!obj || obj.app !== 'sendbook') throw new Error('That isn’t a Sendbook backup file.');
  let n = 0;

}

    const start = st.lat != null ? { lat: st.lat, lon: st.lon } : geo.pos || null;
    openMapPicker(start, c => { st.lat = c.lat; st.lon = c.lon; }, ae.a ? routesIn(ae.a.id) : []);
    picker.restore = () => { areaEditor = ae; showSheet(ae.build(), { kind: 'area-editor' }); };
  },
  'ae-delete': () => {
    const ae = areaEditor;
    if (!ae.st.armed) { ae.st.armed = true; ae.rerender(); return; }
    const id = ae.a.id;
    for (const r of routesIn(id)) store.del('routes', r.id);
    for (const s of sectorsIn(id)) store.del('sectors', s.id);
    store.del('areas', id);
    closeSheet(); go('home'); toast('Area deleted');
  },
  'area-here': async d => {
    closeSheet(); toast('Getting a GPS fix…');
    const f = await geo.fix(); const a = areaById(d.area);
    if (!f || !a) { toast('No GPS fix.'); return; }
    updateArea(a, { lat: f.lat, lon: f.lon });
    toast(`Moved ${a.name} to your location (±${Math.round(f.acc)} m)`); scheduleRender();
  },
  'osm-import': d => { closeSheet(); importOSM(d.area); },
  'sector-new': d => openSectorPrompt(d.area),
  'sector-save': () => saveSector(),
  'crag-sync': d => syncTheCrag(!!d.full),
  'export-csv': () => exportCSV(),
  'export-json': () => exportJSON(),
  'merge-local': () => {
    const local = ls.get(LOCAL_KEY, null); if (!local) return;
    let n = 0; for (const k of KINDS) for (const v of Object.values(local[k] || {})) { if (!data[k][v.id]) { store.put(k, v); n++; } }
    try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
    toast(`Copied ${pluralise(n, 'item')} into your account`); scheduleRender();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el, e);
});
const CHANGE = {
  sector: el => {
    const id = el.dataset.id;
    if (el.value === '__new') { openSectorPrompt(id); el.value = ui.sector[id] || ''; return; }
    ui.sector[id] = el.value; saveUI(); render();
  },
  window: el => { ui.window = el.value; saveUI(); render(); },
  'tcr-target': el => { cragImp.target = el.value; rerenderCragImport(); },
  backdate: el => { sheetState.backdate = el.checked; openSheet.refresh(); },
  'backdate-date': el => { sheetState.date = el.value; },
  'route-notes': el => { const r = data.routes[el.dataset.id]; if (r && r.notes !== el.value) store.put('routes', { ...r, notes: el.value }); },
  'route-project': el => { const r = data.routes[el.dataset.id]; if (r) { store.put('routes', { ...r, project: el.checked }); scheduleRender(); } },
  unmatched: el => { ui.createUnmatched = el.checked; saveUI(); },
  'crag-key': el => ls.set('sendbook.cragKey', el.value.trim()),
  csv: async el => {
    const f = el.files && el.files[0]; if (!f) return;
    try {
      const items = itemsFromCSV(await f.text());
      const m = makeMerger(ui.createUnmatched);
      items.forEach(m.ingest);
      setMsg('csv', `Read ${pluralise(items.length, 'row')}.\n` + m.text());
      scheduleRender();
    } catch (e) { setMsg('csv', e.message); }
    el.value = '';
  },
  backup: async el => {
    const f = el.files && el.files[0]; if (!f) return;
    try { const n = restoreBackup(JSON.parse(await f.text())); setMsg('backup', `Restored ${pluralise(n, 'item')}.`); scheduleRender(); }
    catch (e) { setMsg('backup', e.message || 'Couldn’t read that file.'); }
    el.value = '';
  },
};
document.addEventListener('change', e => {
  const el = e.target;
  const key = el.dataset && el.dataset.change;
  if (key && CHANGE[key]) { CHANGE[key](el); return; }
  if (el.dataset && el.dataset.bind && editor) bindEditor(el);
  if (el.dataset && el.dataset.abind && areaEditor) bindAreaEditor(el, true);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.input === 'tcr-paste') { setCragText(el.value, false); return; }
  if (el.dataset && el.dataset.bind && editor) bindEditor(el, true);
  if (el.dataset && el.dataset.abind && areaEditor) bindAreaEditor(el, false);
});
function bindEditor(el, typing) {
  const st = editor.st, k = el.dataset.bind;
  if (k === 'coords') {
    const p = parseCoords(el.value);
    if (p) { st.lat = p.lat; st.lon = p.lon; } else if (!el.value.trim()) { st.lat = st.lon = null; }
    if (!typing) { st.msg = p ? 'Location set.' : (el.value.trim() ? 'Couldn’t read those coordinates. Use “latitude, longitude”.' : ''); editor.rerender(); }
    return;
  }
  if (k === 'sector') {
    if (el.value === '__new') { const ed = editor; openSectorPrompt(ed.areaId, s => { ed.st.sector = s.id; editor = ed; showSheet(ed.build(), { kind: 'editor' }); }); return; }
    st.sector = el.value; return;
  }
  st[k] = el.value;
  if (k === 'name') { const btn = $('.sheet .sh .link.strong'); if (btn) btn.disabled = !st.name.trim(); }
  if (k === 'grade' && !typing) editor.rerender();
}
function bindAreaEditor(el, commit) {
  const st = areaEditor.st, k = el.dataset.abind;
  if (k === 'coords') { const p = parseCoords(el.value); if (p) { st.lat = p.lat; st.lon = p.lon; } return; }
  st[k] = el.value;
  if (k === 'name') { const btn = $('.sheet .sh .link.strong'); if (btn) btn.disabled = !st.name.trim(); }
}
document.addEventListener('submit', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openSheet) { if (picker) ACT['pick-cancel'](); else closeSheet(); } });
window.addEventListener('hashchange', () => { closeSheet(); render(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch (e) {}
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ============================================================================
// Start
// ============================================================================
store.loadLocal();
render();
geo.autostart();
if (env.hosted) store.connect();
else {
  // The Claude host may attach window.claude after this script runs; switch over if it appears.
  let tries = 0;
  const poll = setInterval(() => {
    if (env.hosted) { clearInterval(poll); render(); store.connect(); }
    else if (++tries > 20) clearInterval(poll);
  }, 150);
}
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
